<!-- Botão hambúrguer (mobile) -->
<button
  class="fixed top-4 left-4 z-50 p-2 rounded-lg bg-teal-700 text-white lg:hidden"
  (click)="toggleMobile()">
  <i class="pi pi-bars text-lg"></i>
</button>

<!-- Overlay mobile -->
@if (mobileAberta()) {
  <div class="fixed inset-0 bg-black/50 z-30 lg:hidden" (click)="fecharMobile()"></div>
}

<!-- Sidebar -->
<aside
  class="fixed inset-y-0 left-0 z-40 w-64 bg-slate-900 flex flex-col transition-transform duration-300 lg:relative lg:translate-x-0"
  [class.-translate-x-full]="!mobileAberta()"
  [class.translate-x-0]="mobileAberta()">

  <!-- Logo -->
  <div class="flex items-center gap-3 px-5 py-5 border-b border-slate-700">
    <div class="flex items-center justify-center w-9 h-9 rounded-xl bg-teal-500">
      <i class="pi pi-heart text-white text-base"></i>
    </div>
    <div>
      <p class="text-white font-bold text-sm leading-tight">SolidarSYS</p>
      <p class="text-slate-400 text-xs">Gestão social</p>
    </div>
  </div>

  <!-- Navegação -->
  <nav class="flex-1 px-3 py-4 space-y-0.5 overflow-y-auto">
    @for (item of navItems; track item.route) {
      <a
        [routerLink]="item.route"
        routerLinkActive="bg-teal-600 text-white"
        [routerLinkActiveOptions]="{ exact: item.route === '/dashboard' }"
        (click)="fecharMobile()"
        class="flex items-center gap-3 px-3 py-2.5 rounded-lg text-slate-300 hover:bg-slate-800 hover:text-white transition-colors text-sm font-medium">
        <i [class]="'pi ' + item.icon + ' text-base w-5 text-center'"></i>
        {{ item.label }}
      </a>
    }
  </nav>

  <!-- Usuário / Logout -->
  <div class="border-t border-slate-700 px-3 py-4">
    <div class="flex items-center gap-3 px-2 mb-3">
      <div class="w-8 h-8 rounded-full bg-teal-600 flex items-center justify-center flex-shrink-0">
        <span class="text-white text-xs font-semibold">
          {{ (auth.usuario()?.nome ?? 'U').charAt(0).toUpperCase() }}
        </span>
      </div>
      <div class="min-w-0">
        <p class="text-white text-xs font-medium truncate">{{ auth.usuario()?.nome }}</p>
        <p class="text-slate-400 text-xs truncate">{{ auth.usuario()?.nivelAcesso }}</p>
      </div>
    </div>
    <button
      (click)="sair()"
      class="flex items-center gap-2 w-full px-3 py-2 rounded-lg text-slate-400 hover:bg-slate-800 hover:text-white transition-colors text-sm">
      <i class="pi pi-sign-out text-base"></i>
      Sair
    </button>
  </div>
</aside>
